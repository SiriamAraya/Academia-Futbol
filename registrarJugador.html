<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Jugador</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body { background:#f4f6f9; }

.card { border-radius:15px; border:none; }

.preview-img {
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #0d6efd;
}
</style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Academia de Fútbol Rincón de Arias
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <!-- REGISTRAR -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown">
                            Registrar
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="registrarJugador.html">
                                    Registrar Jugador
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- LISTADOS -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown">
                            Listados
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="listaJugadores.html">
                                    Listado de Jugadores
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="listaCobros.html">
                                    Listado de Cobros
                                </a>
                            </li>
                        </ul>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
<div class="container mt-5">

<div class="row justify-content-center">
<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-primary text-white">
<h4>Registrar nuevo Jugador</h4>
</div>

<div class="card-body">

<form id="formJugador">

<div class="text-center mb-3">
<img id="preview" class="preview-img">
</div>

<input type="file" id="foto" class="form-control mb-3" accept="image/*" required>

<input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre" required>

<input type="text" id="cedula" class="form-control mb-3" placeholder="Cédula" required>

<input type="date" id="fechaNacimiento" class="form-control mb-3" required>

<input type="text" id="categoria" class="form-control mb-3" readonly>

<button class="btn btn-success w-100">
Guardar Jugador
</button>

</form>

</div>
</div>

</div>
</div>
</div>

<script src="config.js"></script>
<script src="registrarJugador.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
